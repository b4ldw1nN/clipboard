<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded Shield Icon -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#bg)" filter="url(#shadow)" />
  
  <!-- Clipboard Board Base -->
  <rect x="18" y="16" width="28" height="36" rx="4" fill="#ffffff" opacity="0.9" />
  
  <!-- Clipboard Clip Top -->
  <rect x="24" y="12" width="16" height="8" rx="2" fill="#818cf8" />
  <rect x="27" y="14" width="10" height="4" rx="1" fill="#ffffff" />

  <!-- Code / Text Lines -->
  <rect x="23" y="24" width="18" height="3" rx="1.5" fill="#4f46e5" />
  <rect x="23" y="30" width="14" height="3" rx="1.5" fill="#6366f1" />
  <rect x="23" y="36" width="16" height="3" rx="1.5" fill="#818cf8" />
  
  <!-- Pulse / Sync Indicator Dot -->
  <circle cx="44" cy="44" r="5" fill="#10b981" />
  <circle cx="44" cy="44" r="3" fill="#ffffff" />
</svg>
